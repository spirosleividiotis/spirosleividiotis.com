<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio CMS - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d0d0d; color: #e5e5e5; min-height: 100vh; }
        .app { display: flex; flex-direction: column; min-height: 100vh; }
        .topbar { background: #1a1a1a; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; }
        .topbar h1 { font-size: 18px; font-weight: 600; }
        .topbar-actions { display: flex; gap: 12px; }
        .btn { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; }
        .btn-primary { background: #fff; color: #000; }
        .btn-primary:hover { background: #e5e5e5; }
        .btn-secondary { background: #2a2a2a; color: #fff; }
        .btn-secondary:hover { background: #333; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: #141414; border-right: 1px solid #2a2a2a; padding: 16px 0; overflow-y: auto; }
        .sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #666; padding: 8px 20px; margin-bottom: 8px; }
        .sidebar a { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: #999; text-decoration: none; font-size: 14px; border-left: 3px solid transparent; }
        .sidebar a:hover { color: #fff; background: rgba(255,255,255,0.04); }
        .sidebar a.active { color: #fff; background: rgba(255,255,255,0.06); border-left-color: #fff; }
        .sidebar .module-toggle { margin-left: auto; }
        .content { flex: 1; overflow-y: auto; padding: 32px; }
        .panel { display: none; background: #1a1a1a; border-radius: 8px; padding: 28px; margin-bottom: 24px; max-width: 800px; }
        .panel.active { display: block; }
        .panel h3 { font-size: 20px; margin-bottom: 24px; font-weight: 500; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; color: #888; font-size: 13px; }
        .form-group input[type="text"], .form-group input[type="email"], .form-group input[type="url"], .form-group input[type="number"], .form-group textarea { width: 100%; padding: 12px 14px; background: #0d0d0d; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 14px; font-family: inherit; }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .form-group textarea.bodyHtml { min-height: 280px; font-family: ui-monospace, monospace; font-size: 12px; }
        .form-row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
        .form-row .form-group { flex: 1; margin-bottom: 0; }
        .item-card { background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
        .item-card h4 { font-size: 14px; margin-bottom: 12px; color: #ccc; }
        .add-btn { padding: 8px 14px; background: #2a2a2a; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 8px; }
        .add-btn:hover { background: #333; }
        .remove-btn { padding: 6px 12px; background: transparent; color: #888; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 8px; }
        .remove-btn:hover { color: #f44; border-color: #f44; }
        .toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a1a; border: 1px solid #333; padding: 14px 20px; border-radius: 8px; font-size: 14px; z-index: 9999; display: none; }
        .toast.show { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .module-checkbox { accent-color: #fff; width: 18px; height: 18px; cursor: pointer; }
        .file-upload-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .file-upload-row input[type="text"], .file-upload-row input[type="url"] { flex: 1; min-width: 200px; }
        .btn-upload { padding: 8px 14px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }
        .btn-upload:hover { background: #2563eb; }
        .cloudinary-link { font-size: 12px; color: #6b7280; margin-top: 4px; }
        .cloudinary-link a { color: #60a5fa; text-decoration: none; }
        .cloudinary-link a:hover { text-decoration: underline; }
        #loginGate { position: fixed; inset: 0; background: #0d0d0d; display: flex; align-items: center; justify-content: center; z-index: 10000; }
        body:not(.cms-logged-in) .app { display: none !important; }
        body.cms-logged-in #loginGate { display: none !important; }
        .login-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 32px; width: 100%; max-width: 360px; }
        .login-box h2 { font-size: 18px; margin-bottom: 24px; font-weight: 600; }
        .login-box .form-group { margin-bottom: 16px; }
        .login-box label { display: block; margin-bottom: 6px; color: #888; font-size: 13px; }
        .login-box input { width: 100%; padding: 12px 14px; background: #0d0d0d; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 14px; }
        .login-box .btn { width: 100%; margin-top: 8px; padding: 12px; }
        .login-error { color: #f44; font-size: 13px; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div id="loginGate">
        <div class="login-box">
            <h2>Portfolio CMS</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" autocomplete="username" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" autocomplete="current-password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary">Log in</button>
                <p class="login-error" id="loginError">Invalid email or password.</p>
            </form>
        </div>
    </div>
    <div class="app">
        <header class="topbar">
            <h1>Portfolio CMS – Module by module</h1>
            <div class="topbar-actions">
                <a href="https://console.cloud.google.com/storage/browser" target="_blank" rel="noopener" class="btn btn-secondary" style="text-decoration:none;">Open Google Storage</a>
                <span class="topbar-hint" style="font-size:12px;color:#888;margin-right:8px;">Save & Publish Live pushes to the live site (~1 min).</span>
                <button type="button" class="btn btn-secondary" id="btnDownload">Save & Download JSON</button>
                <button type="button" class="btn btn-primary" id="btnPublish">Save & Publish Live</button>
            </div>
        </header>
        <div class="main">
            <nav class="sidebar">
                <h2>Modules on site</h2>
                <a href="#" data-panel="modules" class="nav-link active">Modules (on/off)</a>
                <h2>Edit content</h2>
                <a href="#" data-panel="header" class="nav-link">Header</a>
                <a href="#" data-panel="hero" class="nav-link">Hero</a>
                <a href="#" data-panel="aboutMe" class="nav-link">About Me</a>
                <a href="#" data-panel="reel" class="nav-link">Reel</a>
                <a href="#" data-panel="experience" class="nav-link">Experience</a>
                <a href="#" data-panel="projects" class="nav-link">Projects</a>
                <a href="#" data-panel="footer" class="nav-link">Footer</a>
                <a href="#" data-panel="music" class="nav-link">Music</a>
                <a href="#" data-panel="analytics" class="nav-link">Analytics</a>
            </nav>
            <main class="content" id="cmsContent"></main>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
(function() {
    const CMS_AUTH_KEY = 'cmsAuth';
    const CMS_USER = 'spirosleividiotis@gmail.com';
    const CMS_PASS_HASH = 'df44ae80666be66ed9eb660e3fa6565b853f9c8c76b12b8777e31343c0377a99';

    function sha256Hex(str) {
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
            .then(function(buf) {
                return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
            });
    }

    function checkAuth() {
        if (sessionStorage.getItem(CMS_AUTH_KEY) === '1') document.body.classList.add('cms-logged-in');
    }

    document.addEventListener('DOMContentLoaded', function() {
        checkAuth();
        var form = document.getElementById('loginForm');
        var errEl = document.getElementById('loginError');
        if (form) form.addEventListener('submit', function(e) {
            e.preventDefault();
            errEl.style.display = 'none';
            var email = (document.getElementById('loginEmail').value || '').trim();
            var pass = document.getElementById('loginPassword').value || '';
            if (email.toLowerCase() !== CMS_USER.toLowerCase()) {
                errEl.style.display = 'block';
                return;
            }
            sha256Hex(pass).then(function(hash) {
                if (hash !== CMS_PASS_HASH) {
                    errEl.style.display = 'block';
                    return;
                }
                sessionStorage.setItem(CMS_AUTH_KEY, '1');
                document.body.classList.add('cms-logged-in');
            });
        });
    });
})();
    </script>
    <script>
(function() {
    const MODULE_IDS = ['header', 'hero', 'aboutMe', 'reel', 'experience', 'projects', 'footer', 'music', 'analytics'];
    const DEFAULT_MODULES = Object.fromEntries(MODULE_IDS.map(m => [m, true]));

    let content = { modules: { ...DEFAULT_MODULES } };

    function escapeHtml(s) {
        if (s == null) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    async function loadContent() {
        try {
            const r = await fetch('content.json?v=' + Date.now());
            if (r.ok) {
                const data = await r.json();
                content = data;
                if (!content.modules) content.modules = { ...DEFAULT_MODULES };
                MODULE_IDS.forEach(m => { if (content.modules[m] === undefined) content.modules[m] = true; });
                if (content.mediaBaseUrl == null) content.mediaBaseUrl = '';
            }
        } catch (e) {
            console.error('Load content:', e);
        }
        renderAll();
    }

    function renderAll() {
        renderModulesPanel();
        renderHeaderPanel();
        renderHeroPanel();
        renderAboutMePanel();
        renderReelPanel();
        renderExperiencePanel();
        renderProjectsPanel();
        renderFooterPanel();
        renderMusicPanel();
        renderAnalyticsPanel();
        showPanel('modules');
    }

    function showPanel(id) {
        document.querySelectorAll('.nav-link').forEach(a => a.classList.remove('active'));
        document.querySelector(`[data-panel="${id}"]`)?.classList.add('active');
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        const el = document.getElementById('panel-' + id);
        if (el) el.classList.add('active');
    }

    function renderModulesPanel() {
        const el = document.getElementById('panel-modules');
        if (!el) return;
        el.innerHTML = `
            <h3>Show / hide modules on the site</h3>
            <p style="color:#888;margin-bottom:24px;font-size:14px;">Turn modules on or off. When off, the section is hidden on the live site.</p>
            <div class="form-group" style="margin-bottom:24px;">
                <label>Media base URL (optional)</label>
                <input type="url" id="mediaBaseUrl" value="${escapeHtml(content.mediaBaseUrl || '')}" placeholder="https://storage.googleapis.com/YOUR_BUCKET">
                <p style="color:#777;font-size:12px;margin-top:8px;line-height:1.4;">
                    If you use filenames like <code style="color:#bbb;">portfolio/uploads/images/.../file.png</code> in the CMS, the live site will automatically prefix them with this base URL.
                </p>
            </div>
            ${MODULE_IDS.map(m => `
                <div class="form-row" style="align-items:center;">
                    <label style="margin:0;flex:1;color:#e5e5e5;">${m === 'aboutMe' ? 'About Me' : m.charAt(0).toUpperCase() + m.slice(1)}</label>
                    <input type="checkbox" class="module-checkbox" data-module="${m}" ${content.modules[m] ? 'checked' : ''}>
                </div>
            `).join('')}
        `;
        const baseInput = el.querySelector('#mediaBaseUrl');
        if (baseInput) baseInput.addEventListener('input', () => { content.mediaBaseUrl = baseInput.value; });
        el.querySelectorAll('.module-checkbox').forEach(cb => {
            cb.addEventListener('change', () => { content.modules[cb.dataset.module] = cb.checked; });
        });
    }

    function renderHeaderPanel() {
        content.header = content.header || {};
        const h = content.header;
        if (!h.navigation || !h.navigation.length) h.navigation = [
            { text: 'about me', href: '#' },
            { text: 'experience', href: '#experience' },
            { text: 'reel', href: '#reel' },
            { text: 'projects', href: '#work' }
        ];
        h.location = h.location || {};
        const loc = h.location;
        const el = document.getElementById('panel-header');
        if (!el) return;
        el.innerHTML = `
            <h3>Header</h3>
            <div class="form-group">
                <label>Location text</label>
                <input type="text" id="headerLocationText" value="${escapeHtml(loc.text || '')}" placeholder="e.g. amsterdam">
            </div>
            <div class="form-group">
                <label>Location link (URL)</label>
                <input type="url" id="headerLocationLink" value="${escapeHtml(loc.link || '')}" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>CV file (Download CV link)</label>
                <div class="file-upload-row">
                    <input type="text" id="headerCvFile" value="${escapeHtml(h.cvFile || '')}" placeholder="cv.pdf, portfolio/... or full URL">
                    <button type="button" class="btn-upload" data-upload="headerCvFile" data-type="raw">Upload</button>
                </div>
            </div>
            <div class="form-group">
                <label>Navigation links</label>
                <div id="headerNavList"></div>
                <button type="button" class="add-btn" id="headerNavAdd">+ Add link</button>
            </div>
        `;
        function renderNavList() {
            const list = document.getElementById('headerNavList');
            list.innerHTML = (h.navigation || []).map((item, i) => `
                <div class="item-card">
                    <h4>Link ${i + 1}</h4>
                    <div class="form-row">
                        <div class="form-group"><label>Label</label><input type="text" data-nav-i="${i}" data-key="text" value="${escapeHtml(item.text || '')}"></div>
                        <div class="form-group"><label>URL / hash</label><input type="text" data-nav-i="${i}" data-key="href" value="${escapeHtml(item.href || '')}"></div>
                        <button type="button" class="remove-btn" data-nav-i="${i}">Remove</button>
                    </div>
                </div>
            `).join('');
            list.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('input', () => {
                    const i = parseInt(inp.dataset.navI, 10);
                    if (!content.header.navigation[i]) return;
                    content.header.navigation[i][inp.dataset.key] = inp.value;
                });
            });
            list.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    content.header.navigation.splice(parseInt(btn.dataset.navI, 10), 1);
                    renderNavList();
                });
            });
        }
        document.getElementById('headerNavAdd').addEventListener('click', () => {
            content.header.navigation.push({ text: '', href: '#' });
            renderNavList();
        });
        renderNavList();
        document.getElementById('headerLocationText').addEventListener('input', e => {
            if (!content.header.location) content.header.location = {};
            content.header.location.text = e.target.value;
        });
        document.getElementById('headerLocationLink').addEventListener('input', e => {
            if (!content.header.location) content.header.location = {};
            content.header.location.link = e.target.value;
        });
        document.getElementById('headerCvFile').addEventListener('input', e => { content.header.cvFile = e.target.value; });
    }

    function renderHeroPanel() {
        content.hero = content.hero || {};
        const h = content.hero;
        h.tags = h.tags || { tools: [], skills: [] };
        const tags = h.tags;
        if (!Array.isArray(tags.tools)) tags.tools = [];
        if (!Array.isArray(tags.skills)) tags.skills = [];
        const el = document.getElementById('panel-hero');
        if (!el) return;
        el.innerHTML = `
            <h3>Hero</h3>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="heroName" value="${escapeHtml(h.name || '')}">
            </div>
            <div class="form-group">
                <label>Subtitle</label>
                <textarea id="heroSubtitle" rows="3">${escapeHtml(h.subtitle || '')}</textarea>
            </div>
            <div class="form-group">
                <label>Photo (URL)</label>
                <div class="file-upload-row">
                    <input type="url" id="heroPhoto" value="${escapeHtml(h.photo || '')}" placeholder="Image URL or upload">
                    <button type="button" class="btn-upload" data-upload="heroPhoto" data-type="image">Upload</button>
                </div>
            </div>
            <div class="form-group">
                <label>Tools (one per line or comma-separated)</label>
                <textarea id="heroTools" rows="3">${(tags.tools || []).join('\n')}</textarea>
            </div>
            <div class="form-group">
                <label>Skills (one per line or comma-separated)</label>
                <textarea id="heroSkills" rows="3">${(tags.skills || []).join('\n')}</textarea>
            </div>
        `;
        document.getElementById('heroName').addEventListener('input', e => { content.hero.name = e.target.value; });
        document.getElementById('heroSubtitle').addEventListener('input', e => { content.hero.subtitle = e.target.value; });
        document.getElementById('heroPhoto').addEventListener('input', e => { content.hero.photo = e.target.value; });
        document.getElementById('heroTools').addEventListener('input', e => {
            content.hero.tags = content.hero.tags || {};
            content.hero.tags.tools = e.target.value.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
        });
        document.getElementById('heroSkills').addEventListener('input', e => {
            content.hero.tags = content.hero.tags || {};
            content.hero.tags.skills = e.target.value.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
        });
    }

    function renderAboutMePanel() {
        content.aboutMe = content.aboutMe || {};
        const a = content.aboutMe;
        if (!Array.isArray(a.bio)) a.bio = [];
        const el = document.getElementById('panel-aboutMe');
        if (!el) return;
        el.innerHTML = `
            <h3>About Me</h3>
            <div class="form-group">
                <label>Photo (URL)</label>
                <div class="file-upload-row">
                    <input type="url" id="aboutPhoto" value="${escapeHtml(a.photo || '')}" placeholder="Image URL or upload">
                    <button type="button" class="btn-upload" data-upload="aboutPhoto" data-type="image">Upload</button>
                </div>
            </div>
            <div class="form-group">
                <label>Bio paragraphs (one paragraph per textarea)</label>
                <div id="aboutBioList"></div>
                <button type="button" class="add-btn" id="aboutBioAdd">+ Add paragraph</button>
            </div>
        `;
        function renderBioList() {
            const list = document.getElementById('aboutBioList');
            list.innerHTML = (content.aboutMe.bio || []).map((p, i) => `
                <div class="item-card">
                    <h4>Paragraph ${i + 1}</h4>
                    <textarea data-bio-i="${i}" rows="4">${escapeHtml(p)}</textarea>
                    <button type="button" class="remove-btn" data-bio-i="${i}">Remove</button>
                </div>
            `).join('');
            list.querySelectorAll('textarea').forEach(ta => {
                ta.addEventListener('input', () => {
                    const i = parseInt(ta.dataset.bioI, 10);
                    content.aboutMe.bio[i] = ta.value;
                });
            });
            list.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    content.aboutMe.bio.splice(parseInt(btn.dataset.bioI, 10), 1);
                    renderBioList();
                });
            });
        }
        document.getElementById('aboutPhoto').addEventListener('input', e => { content.aboutMe.photo = e.target.value; });
        document.getElementById('aboutBioAdd').addEventListener('click', () => {
            content.aboutMe.bio = content.aboutMe.bio || [];
            content.aboutMe.bio.push('');
            renderBioList();
        });
        renderBioList();
    }

    function renderExperiencePanel() {
        content.experience = Array.isArray(content.experience) ? content.experience : [];
        const el = document.getElementById('panel-experience');
        if (!el) return;
        el.innerHTML = `
            <h3>Experience</h3>
            <p style="color:#888;margin-bottom:20px;font-size:14px;">Each company can have multiple roles. Add/remove companies and roles.</p>
            <div id="experienceList"></div>
            <button type="button" class="add-btn" id="expAddCompany">+ Add company</button>
        `;
        function renderExpList() {
            const list = document.getElementById('experienceList');
            list.innerHTML = (content.experience || []).map((company, ci) => `
                <div class="item-card" style="margin-bottom:20px;">
                    <h4>Company: ${escapeHtml(company.company || '')}</h4>
                    <div class="form-group">
                        <label>Company name</label>
                        <input type="text" data-ci="${ci}" data-key="company" value="${escapeHtml(company.company || '')}">
                    </div>
                    <div class="form-group">
                        <label>Image (filename or URL)</label>
                        <div class="file-upload-row">
                            <input type="text" id="exp-image-${ci}" data-ci="${ci}" data-key="image" value="${escapeHtml(company.image || '')}" placeholder="URL or upload">
                            <button type="button" class="btn-upload" data-upload="exp-image-${ci}" data-type="image">Upload</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Roles</label>
                        <div class="roles-list-${ci}"></div>
                        <button type="button" class="add-btn exp-add-role" data-ci="${ci}">+ Add role</button>
                    </div>
                    <button type="button" class="remove-btn" data-remove-ci="${ci}">Remove company</button>
                </div>
            `).join('');
            list.querySelectorAll('input[data-ci]').forEach(inp => {
                inp.addEventListener('input', () => {
                    const ci = parseInt(inp.dataset.ci, 10);
                    content.experience[ci] = content.experience[ci] || {};
                    content.experience[ci][inp.dataset.key] = inp.value;
                });
            });
            (content.experience || []).forEach((company, ci) => {
                const rolesEl = list.querySelector('.roles-list-' + ci);
                if (!rolesEl) return;
                const roles = company.roles || [];
                rolesEl.innerHTML = roles.map((role, ri) => `
                    <div class="item-card" style="margin-top:8px;">
                        <div class="form-row"><div class="form-group"><label>Title</label><input type="text" data-ci="${ci}" data-ri="${ri}" data-key="title" value="${escapeHtml(role.title || '')}"></div></div>
                        <div class="form-row">
                            <div class="form-group"><label>Start</label><input type="text" data-ci="${ci}" data-ri="${ri}" data-key="start" value="${escapeHtml((role.period && role.period.start) || '')}" placeholder="2024"></div>
                            <div class="form-group"><label>End</label><input type="text" data-ci="${ci}" data-ri="${ri}" data-key="end" value="${escapeHtml((role.period && role.period.end) || '')}" placeholder="Now"></div>
                        </div>
                        <div class="form-group"><label>Description</label><textarea data-ci="${ci}" data-ri="${ri}" data-key="description" rows="3">${escapeHtml(role.description || '')}</textarea></div>
                        <button type="button" class="remove-btn exp-remove-role" data-ci="${ci}" data-ri="${ri}">Remove role</button>
                    </div>
                `).join('');
                rolesEl.querySelectorAll('input, textarea').forEach(inp => {
                    inp.addEventListener('input', () => {
                        const ri = parseInt(inp.dataset.ri, 10);
                        content.experience[ci].roles = content.experience[ci].roles || [];
                        if (inp.dataset.key === 'start' || inp.dataset.key === 'end') {
                            content.experience[ci].roles[ri].period = content.experience[ci].roles[ri].period || {};
                            content.experience[ci].roles[ri].period[inp.dataset.key === 'start' ? 'start' : 'end'] = inp.value;
                        } else {
                            content.experience[ci].roles[ri][inp.dataset.key] = inp.value;
                        }
                    });
                });
                rolesEl.querySelectorAll('.exp-remove-role').forEach(btn => {
                    btn.addEventListener('click', () => {
                        content.experience[ci].roles.splice(parseInt(btn.dataset.ri, 10), 1);
                        renderExpList();
                    });
                });
            });
            list.querySelectorAll('.exp-add-role').forEach(btn => {
                btn.addEventListener('click', () => {
                    const ci = parseInt(btn.dataset.ci, 10);
                    content.experience[ci].roles = content.experience[ci].roles || [];
                    content.experience[ci].roles.push({ title: '', period: { start: '', end: '' }, description: '' });
                    renderExpList();
                });
            });
            list.querySelectorAll('[data-remove-ci]').forEach(btn => {
                btn.addEventListener('click', () => {
                    content.experience.splice(parseInt(btn.dataset.removeCi, 10), 1);
                    renderExpList();
                });
            });
        }
        document.getElementById('expAddCompany').addEventListener('click', () => {
            content.experience = content.experience || [];
            content.experience.push({ company: '', image: '', roles: [{ title: '', period: { start: '', end: '' }, description: '' }] });
            renderExpList();
        });
        renderExpList();
    }

    function renderReelPanel() {
        content.reel = content.reel || {};
        const r = content.reel;
        const el = document.getElementById('panel-reel');
        if (!el) return;
        el.innerHTML = `
            <h3>Reel</h3>
            <div class="form-group">
                <label>Video URL</label>
                <div class="file-upload-row">
                    <input type="url" id="reelFile" value="${escapeHtml(r.file || '')}" placeholder="Video URL or upload">
                    <button type="button" class="btn-upload" data-upload="reelFile" data-type="video">Upload</button>
                </div>
            </div>
        `;
        document.getElementById('reelFile').addEventListener('input', e => { content.reel.file = e.target.value; });
    }

    function renderProjectsPanel() {
        content.projects = content.projects || [];
        const el = document.getElementById('panel-projects');
        if (!el) return;
        el.innerHTML = `
            <h3>Projects</h3>
            <p style="color:#888;margin-bottom:20px;font-size:14px;">Card preview, name, company, optional password, and project body HTML (paste from existing project page to move content into CMS).</p>
            <div id="projectsList"></div>
            <button type="button" class="add-btn" id="projectsAdd">+ Add project</button>
        `;
        function renderProjectsList() {
            const list = document.getElementById('projectsList');
            list.innerHTML = content.projects.map((proj, pi) => `
                <div class="item-card" style="margin-bottom:24px;">
                    <h4>${escapeHtml(proj.name || 'Project ' + (pi + 1))}</h4>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" data-pi="${pi}" data-key="name" value="${escapeHtml(proj.name || '')}">
                    </div>
                    <div class="form-group">
                        <label>Company</label>
                        <input type="text" data-pi="${pi}" data-key="company" value="${escapeHtml(proj.company || '')}">
                    </div>
                    <div class="form-group">
                        <label>Card preview (image/video URL)</label>
                        <div class="file-upload-row">
                            <input type="url" id="proj-preview-${pi}" data-pi="${pi}" data-key="cardPreview" value="${escapeHtml(proj.cardPreview || '')}" placeholder="URL or upload">
                            <button type="button" class="btn-upload" data-upload="proj-preview-${pi}" data-type="auto">Upload</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Color (hex)</label>
                        <input type="text" data-pi="${pi}" data-key="color" value="${escapeHtml(proj.color || '#141414')}" placeholder="#141414">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label><input type="checkbox" data-pi="${pi}" data-key="passwordProtected" ${proj.passwordProtected ? 'checked' : ''}> Password protected</label>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="text" data-pi="${pi}" data-key="password" value="${escapeHtml(proj.password || '')}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Custom URL (legacy HTML file, e.g. motion-system-content.html)</label>
                        <input type="text" data-pi="${pi}" data-key="customUrl" value="${escapeHtml(proj.customUrl || '')}" placeholder="Leave empty if using Body HTML below">
                    </div>
                    <div class="form-group">
                        <label>Media: Hero (HTML file or image/video URL)</label>
                        <input type="text" data-pi="${pi}" data-key="mediaHero" value="${escapeHtml((proj.media && proj.media.hero) || '')}">
                    </div>
                    <div class="form-group">
                        <label>Body HTML (paste full content from project page to store in CMS; overrides Custom URL when set)</label>
                        <textarea class="bodyHtml" data-pi="${pi}" data-key="bodyHtml" placeholder="Optional: paste HTML from project-*.html">${escapeHtml(proj.bodyHtml || '')}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Grid media (one URL per line)</label>
                        <textarea data-pi="${pi}" data-key="grid" rows="2" placeholder="selection-01.gif\nselection-02.mp4">${(proj.media && Array.isArray(proj.media.grid)) ? proj.media.grid.join('\n') : ''}</textarea>
                    </div>
                    <button type="button" class="remove-btn" data-remove-pi="${pi}">Remove project</button>
                </div>
            `).join('');
            list.querySelectorAll('input[data-pi], textarea[data-pi]').forEach(inp => {
                const pi = parseInt(inp.dataset.pi, 10);
                const key = inp.dataset.key;
                const isCheck = inp.type === 'checkbox';
                const handler = () => {
                    content.projects[pi] = content.projects[pi] || {};
                    if (key === 'mediaHero') {
                        content.projects[pi].media = content.projects[pi].media || {};
                        content.projects[pi].media.hero = inp.value;
                    } else if (key === 'grid') {
                        content.projects[pi].media = content.projects[pi].media || {};
                        content.projects[pi].media.grid = inp.value.split('\n').map(s => s.trim()).filter(Boolean);
                    } else if (key === 'bodyHtml') {
                        content.projects[pi].bodyHtml = inp.value;
                    } else if (key === 'passwordProtected') {
                        content.projects[pi].passwordProtected = inp.checked;
                    } else {
                        content.projects[pi][key] = isCheck ? inp.checked : inp.value;
                    }
                };
                if (isCheck) inp.addEventListener('change', handler); else inp.addEventListener('input', handler);
            });
            list.querySelectorAll('[data-remove-pi]').forEach(btn => {
                btn.addEventListener('click', () => {
                    content.projects.splice(parseInt(btn.dataset.removePi, 10), 1);
                    renderProjectsList();
                });
            });
        }
        document.getElementById('projectsAdd').addEventListener('click', () => {
            const nextId = content.projects.length ? Math.max(...content.projects.map(p => p.id || 0)) + 1 : 1;
            content.projects.push({
                id: nextId,
                name: '',
                company: '',
                color: '#141414',
                passwordProtected: false,
                password: '',
                customUrl: '',
                bodyText: '',
                cardPreview: '',
                media: { hero: '', grid: [] }
            });
            renderProjectsList();
        });
        renderProjectsList();
    }

    function renderFooterPanel() {
        content.footer = content.footer || {};
        const f = content.footer;
        if (!Array.isArray(f.social)) f.social = [];
        const el = document.getElementById('panel-footer');
        if (!el) return;
        el.innerHTML = `
            <h3>Footer</h3>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="footerEmail" value="${escapeHtml(f.email || '')}">
            </div>
            <div class="form-group">
                <label>Logo (filename or URL)</label>
                <div class="file-upload-row">
                    <input type="text" id="footerLogo" value="${escapeHtml(f.logo || '')}" placeholder="URL or upload">
                    <button type="button" class="btn-upload" data-upload="footerLogo" data-type="image">Upload</button>
                </div>
            </div>
            <div class="form-group">
                <label>Year</label>
                <input type="text" id="footerYear" value="${escapeHtml(f.year || '')}">
            </div>
            <div class="form-group">
                <label>CV (filename or URL)</label>
                <input type="text" id="footerCvFile" value="${escapeHtml(f.cvFile || '')}" placeholder="cv.pdf or URL">
            </div>
            <div class="form-group">
                <label>Social links</label>
                <div id="footerSocialList"></div>
                <button type="button" class="add-btn" id="footerSocialAdd">+ Add link</button>
            </div>
        `;
        function renderSocialList() {
            const list = document.getElementById('footerSocialList');
            list.innerHTML = (content.footer.social || []).map((s, i) => `
                <div class="item-card">
                    <div class="form-row">
                        <div class="form-group"><label>Name</label><input type="text" data-si="${i}" data-key="name" value="${escapeHtml(s.name || '')}"></div>
                        <div class="form-group"><label>URL</label><input type="url" data-si="${i}" data-key="url" value="${escapeHtml(s.url || '')}"></div>
                        <button type="button" class="remove-btn" data-si="${i}">Remove</button>
                    </div>
                </div>
            `).join('');
            list.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('input', () => {
                    const i = parseInt(inp.dataset.si, 10);
                    content.footer.social[i][inp.dataset.key] = inp.value;
                });
            });
            list.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    content.footer.social.splice(parseInt(btn.dataset.si, 10), 1);
                    renderSocialList();
                });
            });
        }
        document.getElementById('footerEmail').addEventListener('input', e => { content.footer.email = e.target.value; });
        document.getElementById('footerLogo').addEventListener('input', e => { content.footer.logo = e.target.value; });
        document.getElementById('footerYear').addEventListener('input', e => { content.footer.year = e.target.value; });
        document.getElementById('footerCvFile').addEventListener('input', e => { content.footer.cvFile = e.target.value; });
        document.getElementById('footerSocialAdd').addEventListener('click', () => {
            content.footer.social = content.footer.social || [];
            content.footer.social.push({ name: '', url: '' });
            renderSocialList();
        });
        renderSocialList();
    }

    function renderMusicPanel() {
        content.music = content.music || {};
        const m = content.music;
        const el = document.getElementById('panel-music');
        if (!el) return;
        el.innerHTML = `
            <h3>Music</h3>
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="musicTitle" value="${escapeHtml(m.title || '')}">
            </div>
            <div class="form-group">
                <label>Audio file URL (song)</label>
                <div class="file-upload-row">
                    <input type="url" id="musicFile" value="${escapeHtml(m.file || '')}" placeholder="Audio URL or upload">
                    <button type="button" class="btn-upload" data-upload="musicFile" data-type="video">Upload</button>
                </div>
            </div>
        `;
        document.getElementById('musicTitle').addEventListener('input', e => { content.music.title = e.target.value; });
        document.getElementById('musicFile').addEventListener('input', e => { content.music.file = e.target.value; });
    }

    function renderAnalyticsPanel() {
        content.analytics = content.analytics || {};
        const a = content.analytics;
        const gaMatch = (a.script || '').match(/G-[A-Z0-9]+/);
        const gaId = gaMatch ? gaMatch[0] : '';
        const el = document.getElementById('panel-analytics');
        if (!el) return;
        el.innerHTML = `
            <h3>Analytics</h3>
            <div class="form-group" style="margin-bottom:24px;">
                <label>View visit stats</label>
                <p style="color:#888;font-size:14px;margin-bottom:12px;">Open Google Analytics to see traffic, visits, and user behaviour for your site.</p>
                <a href="https://analytics.google.com/" target="_blank" rel="noopener" class="btn btn-primary" style="display:inline-block;text-decoration:none;">Open Google Analytics</a>
                ${gaId ? `<span style="margin-left:12px;color:#666;font-size:13px;">Measurement ID: ${escapeHtml(gaId)}</span>` : ''}
            </div>
            <div class="form-group">
                <label>Script (e.g. Google Analytics)</label>
                <textarea id="analyticsScript" rows="8" placeholder="Paste script tag(s) or tracking code">${escapeHtml(a.script || '')}</textarea>
            </div>
        `;
        document.getElementById('analyticsScript').addEventListener('input', e => { content.analytics.script = e.target.value; });
    }

    function buildContentPanels() {
        const container = document.getElementById('cmsContent');
        container.innerHTML = '<div class="panel active" id="panel-modules"></div>' + MODULE_IDS.filter(m => m !== 'modules').map(m => `<div class="panel" id="panel-${m}"></div>`).join('');
    }

    document.querySelectorAll('.nav-link').forEach(a => {
        a.addEventListener('click', (e) => {
            e.preventDefault();
            showPanel(a.dataset.panel);
        });
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
        const json = JSON.stringify(content, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'content.json';
        link.click();
        URL.revokeObjectURL(url);
        toast('Downloaded content.json. Use Save & Publish Live to push to the live site.');
    });

    document.getElementById('btnPublish').addEventListener('click', async () => {
        try {
            const r = await fetch('/api/publish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            const data = await r.json().catch(() => ({}));
            if (r.ok && data.success) {
                toast('Changes pushed. Live site updates in ~1 min.');
            } else {
                toast('Publish failed: ' + (data.error || data.details || r.statusText));
            }
        } catch (e) {
            toast('Publish failed: ' + e.message);
        }
    });

    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 3000);
    }

    async function openGoogleUpload(fieldId, resourceType) {
        const input = document.createElement('input');
        input.type = 'file';
        if (resourceType === 'image') input.accept = 'image/*';
        else if (resourceType === 'video') input.accept = 'video/*,audio/*';
        else if (resourceType === 'raw') input.accept = '*/*';
        else input.accept = '*/*';

        input.onchange = async () => {
            const file = input.files && input.files[0];
            if (!file) return;
            try {
                toast('Signing upload…');
                const signRes = await fetch('/api/gcs-sign', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fileName: file.name,
                        contentType: file.type || 'application/octet-stream',
                        resourceType: resourceType || 'raw'
                    })
                });
                const signed = await signRes.json().catch(() => ({}));
                if (!signRes.ok) throw new Error(signed.error || signed.details || signRes.statusText);
                if (!signed.uploadUrl || !signed.path) throw new Error('Invalid signed upload response');

                toast('Uploading…');
                const putRes = await fetch(signed.uploadUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': file.type || 'application/octet-stream' },
                    body: file
                });
                if (!putRes.ok) throw new Error('Upload failed (' + putRes.status + ')');

                const el = document.getElementById(fieldId);
                if (el) {
                    // Store path (relative) so it works with mediaBaseUrl
                    el.value = signed.path;
                    el.dispatchEvent(new Event('input'));
                }
                toast('Uploaded');
            } catch (e) {
                toast('Upload failed: ' + e.message);
            }
        };
        input.click();
    }

    document.getElementById('cmsContent').addEventListener('click', function(e) {
        const btn = e.target.closest('.btn-upload');
        if (btn && btn.dataset.upload) openGoogleUpload(btn.dataset.upload, btn.dataset.type || 'image');
    });

    buildContentPanels();
    loadContent();
})();
    </script>
